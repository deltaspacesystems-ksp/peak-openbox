; Catppuccin Mocha - polybar (prawa strona jak w default config)
[colors]
base = #1e1e2e
mantle = #181825
surface0 = #313244
surface1 = #45475a
text = #cdd6f4
subtext = #a6adc8
overlay = #6c7086
blue = #89b4fa
mauve = #cba6f7
green = #a6e3a1
yellow = #f9e2af
peach = #fab387
red = #f38ba8
teal = #94e2d5

[bar/main]
width = 100%:-24
height = 30
offset-x = 12
offset-y = 8
radius = 12
fixed-center = true
bottom = false

background = ${colors.base}
foreground = ${colors.text}

line-size = 2
padding-left = 2
padding-right = 2
module-margin = 1

separator = |
separator-foreground = ${colors.overlay}

font-0 = JetBrainsMono Nerd Font Propo:size=11;3
font-1 = JetBrainsMono Nerd Font Mono:size=13;4

modules-left = launcher mfw-keyboard xworkspaces
modules-right = pulseaudio wlan date

cursor-click = pointer
enable-ipc = true

[module/launcher]
type = custom/text
content = Apps
content-foreground = ${colors.mauve}
content-padding = 1
click-left = /home/microfw/.config/rofi/launcher.sh

[module/xworkspaces]
type = internal/xworkspaces
label-active = %index%
label-active-background = ${colors.surface0}
label-active-foreground = ${colors.mauve}
label-active-underline = ${colors.mauve}
label-active-padding = 2
label-occupied = %index%
label-occupied-foreground = ${colors.subtext}
label-occupied-padding = 2
label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.base}
label-urgent-padding = 2
label-empty = %index%
label-empty-foreground = ${colors.overlay}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.subtext}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{F#89b4fa}%mountpoint%%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.overlay}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.overlay}
click-right = pavucontrol

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.blue}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.base}
label-indicator-background = ${colors.mauve}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.blue}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%

[module/wlan]
type = custom/script
exec = /home/microfw/.config/polybar/wifi-status.sh
interval = 3
click-left = /home/microfw/.config/polybar/wifi-menu.sh
click-middle = nm-connection-editor
click-right = /home/microfw/.config/polybar/wifi-toggle.sh

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#89b4fa}%ifname%%{F#6c7086} disconnected

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#89b4fa}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %A, %d %B %Y  %H:%M:%S
label = %date%
label-foreground = ${colors.blue}

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/mfw-keyboard]
type = custom/text
content = Keyboard
content-padding = 1
click-left = /home/microfw/.config/openbox/keyboard-toggle.sh
