# lekka konfiguracja pod Atom (Cherry Trail): xrender, bez blur i animacji
backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.40;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-color = "#11111b";
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@"
];

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

fading = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
